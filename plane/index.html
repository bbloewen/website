<title>Basketball Löwen Erfurt</title>
<!--
  QR-Einstieg der Gerüstplanen (Gerüstbau Grund, Druck Turtschan), angelegt 16.11.2026 (Marko).

  Der QR-Code auf den Planen zeigt fest auf https://basketball-loewen.com/plane und darf sich
  nie ändern, sonst zeigen gedruckte Planen ins Leere. Wohin es danach geht, steht hier
  in ZIEL (und für Browser ohne JavaScript im meta-refresh und im Link darunter) und kann
  jederzeit umgestellt werden.

  Gezählt wird in GoatCounter: Die Zielseite bekommt ?ref=plane angehängt, GoatCounter führt
  das als Herkunft „plane“ (Referrer/Kampagne) bei der Zielseite. Die kurze Adresse hält den
  QR-Code grob (Version 5 bei Fehlerkorrektur H statt 8), damit er aus mehreren Metern Entfernung noch lesbar ist.
-->
<script>
  var ZIEL = "/trainieren/loewenpark-spenden.html";
  location.replace(ZIEL + (ZIEL.indexOf("?") < 0 ? "?" : "&") + "ref=plane");
</script>
<meta http-equiv="refresh" content="1; url=/trainieren/loewenpark-spenden.html?ref=plane" />
<style>body{font-family:system-ui,sans-serif;margin:40px 16px;text-align:center;color:#1b2265}</style>
</head>
<body>
<p><a href="/trainieren/loewenpark-spenden.html?ref=plane">Weiter zu den Basketball Löwen Erfurt</a></p>
</body>
</html>
