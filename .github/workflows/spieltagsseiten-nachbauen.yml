# Baut die Spieltagsseiten nach, wenn sich data/heimspiele.json aendert -- und
# taeglich, weil die Phase (angekuendigt/vorverkauf/spieltag/danach) einer Seite
# allein vom aktuellen Datum abhaengt, nicht nur von der JSON. Ohne den
# taeglichen Lauf wuerde eine Seite z. B. am Spieltag selbst weiter die
# Vorverkaufs-Ansicht zeigen, bis irgendwann jemand von Hand baut.
#
# Anlass (25.08.2026, Marko): "Jedes Heimspiel bekommt eine Adresse -- und
# behaelt sie sein ganzes Leben." s. tools/build-spieltagsseiten.py fuer Details.
#
# Seit 12.10.2026 laeuft build-dauerkartenpreise.py mit: die Dauerkartenpreise sinken 4 Stunden
# nach jedem Heimspiel (Marko), der 20-Minuten-Takt am Abend faengt das ab.
#
# Seit 04.10.2026 laeuft build-next-game.py mit. Das Spieltags-Widget im
# Startseiten-Hero haengt genauso am Kalender wie die Spieltagsseiten: welches
# Spiel "aktuell" ist, endet am Dienstag nach dem Spieltag. Die statische
# Fassung in index.html wurde aber nur nachgezogen, wenn jemand von Hand
# tools/bauen.sh laufen liess -- deshalb stand dort tagelang ein veralteter
# Stand (am 04.10.2026 zwei Spiele statt drei, weil der letzte Lauf in das
# Fenster ohne aktuelles Spiel fiel). Das JavaScript korrigiert das im Browser
# sofort, aber beim ersten Rendern und fuer Crawler ohne JS war der falsche
# Stand sichtbar (Marko, 04.10.2026).

name: Spieltagsseiten nachbauen

on:
  push:
    branches: [main]
    paths:
      - data/heimspiele.json
  schedule:
    - cron: '20 4 * * *'
    # Gameday-Hub umstellen und Vorverkauf eroeffnen, 4 Stunden nach Anpfiff (Marko, 11.10.2026).
    # Heimspiele beginnen 14:30-19:30 Ortszeit, das Umschalten faellt also zwischen 18:30 und
    # 23:30 Ortszeit = 16:30-22:30 UTC. Alle 20 Minuten in diesem Fenster; ein Lauf ohne
    # Aenderung committet nichts (s. unten). GitHub verzoegert geplante Laeufe gelegentlich
    # um einige Minuten.
    - cron: '*/20 16-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spieltagsseiten-nachbauen
  cancel-in-progress: false

jobs:
  nachbauen:
    # Ohne diese Grenze wuerde der eigene Commit den Lauf erneut ausloesen.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-sitemap.py liest lastmod aus der Commit-Historie.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Seit 11.10.2026 liest build-spieltagsseiten.py Bildmasse (Berichte-Teaser,
      # Spieltagsinfo-Band) -- das braucht Pillow. Ohne laeuft der CI-Bau anders als
      # der lokale und schrieb die Seiten ohne Band-Bild zurueck.
      - name: Pillow installieren
        run: pip install --quiet --disable-pip-version-check pillow

      # Reihenfolge ist hier bindend, s. tools/README.md: build-spieltagsseiten.py
      # baut jede Seite komplett neu und uebernimmt Header/Footer/SEO-Block nur
      # unveraendert aus der bestehenden Datei -- andersherum wuerde jeder Lauf
      # die von build-partials.py gerade eingefuegten Header/Footer wieder leeren.
      - name: Spieltagsseiten, Startseiten-Widget, Partials, Head-Meta und Sitemap neu bauen
        run: |
          python3 tools/vorverkauf-starten.py
          # Dauerkartenpreise VOR dem Hub: der Hub liest die data-base-Werte aus tickets/dauerkarte.html.
          # Sie sinken 4 Stunden nach jedem Heimspiel um einen Einzelpreis (Marko, 12.10.2026),
          # im selben Moment, in dem der Hub aufs naechste Spiel umschaltet.
          python3 tools/build-dauerkartenpreise.py
          python3 tools/build-spieltagsseiten.py
          python3 tools/build-gameday-hub.py
          python3 tools/build-kalender.py
          python3 tools/build-next-game.py
          python3 tools/build-partials.py
          python3 tools/build-head-meta.py
          python3 tools/build-sitemap.py

      - name: Aenderungen committen
        run: |
          if git diff --quiet && git status --porcelain saison/profis/gameday/ | grep -q .; then
            :
          elif git diff --quiet; then
            echo "Nichts nachzuziehen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saison/profis/gameday/ kalender/ data/heimspiele.json data/dauerkarte-preise.json tickets/dauerkarte.html saison/spielplan.html index.html sitemap.xml data/seiten-stand.json
          git diff --cached --quiet && { echo "Nichts nachzuziehen."; exit 0; }
          git commit -m "Spieltagsseiten und Startseiten-Widget: Phase/Sitemap nachgezogen"
          git push
