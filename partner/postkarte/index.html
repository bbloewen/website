<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noai, noimageai" />
<meta name="referrer" content="no-referrer" />
<title>Postkarten drucken — Basketball Löwen</title>
<link rel="icon" href="/assets/logo/loewen-logo-4c.svg" />
<link rel="stylesheet" href="/css/colors_and_type.css?v=1785398309" />
<!-- Postkarten nach dem neuen Standard (Migration 557, Marko 27.11.2026; Postkarten-Übergabe 2026-11-27, Referenz druck.py und felder.json).
     Interne Druckseite, nicht verlinkt. ?c=<code>,<code> (persönliche Seiten) holt je Karte die Felder aus 305 (Endpunkt postkarte, zählt nichts).
     Standard (?modus=einzel, Marko 27.11.2026): je Karte zwei Seiten im Format A6 quer (148 × 105 mm), vorne und hinten, nichts ausschneiden.
     ?modus=bogen: zwei Karten je A4 mit 3 mm Beschnitt und Schnittmarken, Seite 1 Vorderseiten, Seite 2 Rückseiten an denselben Stellen.
     Beidseitig drucken, Wenden an der langen Kante, Größe 100 %. ?von=marko|andre setzt den Absender (sonst der Absender der Kampagne).
     Motive: /assets/postkarte/motive/<Position>.webp, Standardtexte der Vorderseite: /data/postkarten.json. -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/js/qr-loewe.js?v=1795780000"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Lexend', sans-serif; color: #00122D; background: #e9ecf1; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.leiste { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; background: #fff; border-bottom: 1px solid #dfe3ea; font-size: 14px; }
.leiste .knoepfe { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.leiste button, .leiste a.umschalten { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #c9d0db; background: #fff; color: #00122D; font: 600 14px 'Lexend', sans-serif; cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
.leiste a.umschalten[aria-current="true"] { background: #00122D; color: #fff; border-color: #00122D; }
.leiste button.druck { background: #E5710B; border-color: #E5710B; color: #00122D; font-weight: 700; }
.leiste button:focus-visible, .leiste a:focus-visible { outline: 3px solid #0028AA; outline-offset: 2px; }
.hinweis { color: #4a5568; max-width: 640px; }
.warnung { margin: 12px 16px 0; padding: 10px 14px; border-radius: 8px; background: #fff4e5; border: 1px solid #f0c48a; color: #6b3b00; font-size: 14px; }
.warnung:empty { display: none; }
.seiten { display: grid; gap: 24px; justify-content: center; padding: 24px 16px 60px; }
@media screen and (max-width: 860px) { .seiten { zoom: .45; } }

@page { size: 210mm 297mm; margin: 0; }
.pg { width: 210mm; height: 297mm; position: relative; overflow: hidden; background: #fff; box-shadow: 0 8px 28px rgba(0,18,45,.16); }
@media print { body { background: #fff; } .leiste, .warnung { display: none !important; } .seiten { display: block; padding: 0; zoom: 1; } .pg { box-shadow: none; page-break-after: always; break-after: page; } .ueberlauf { outline: none !important; } }
.cd { position: absolute; overflow: hidden; }
.t { position: absolute; width: 148mm; height: 105mm; }
.f { position: absolute; }
/* Vorderseite (felder.json → vorderseite) */
.h { position: absolute; left: 8mm; top: 12mm; width: 52mm; font-weight: 900; font-size: 6.8mm; line-height: 1.8; letter-spacing: -.01em; color: #00122D; }
.h b { font-weight: 900; background: #00122D; color: #E5710B; padding: .14em .2em; border-radius: .14em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.n { position: absolute; left: 11mm; top: 87.2mm; font-weight: 800; font-size: 5mm; letter-spacing: .05em; text-transform: uppercase; color: #fff; white-space: nowrap; }
.n.nc { text-transform: none; letter-spacing: .02em; }
.c { position: absolute; left: 11mm; top: 94mm; font-weight: 400; font-size: 3.5mm; color: #F09E4C; white-space: nowrap; }
/* Rückseite (felder.json → rueckseite) */
.anrede { left: 8mm; top: 11mm; width: 60mm; height: 5mm; font-weight: 300; font-size: 3.1mm; line-height: 1.5; white-space: nowrap; overflow: hidden; }
.msg { left: 8mm; top: 20.3mm; width: 60mm; height: 40.7mm; font-weight: 300; font-size: 3.1mm; line-height: 1.5; white-space: pre-wrap; overflow: hidden; }
.intro { left: 8mm; top: 63.3mm; width: 60mm; font-weight: 300; font-size: 3.1mm; line-height: 1.3; white-space: nowrap; }
.code { left: 8mm; top: 67.5mm; width: 60mm; text-align: center; font-weight: 800; font-size: 5.4mm; letter-spacing: .05em; line-height: 1.3; white-space: nowrap; }
.abschied { left: 8mm; top: 78.4mm; width: 60mm; font-weight: 300; font-size: 3.1mm; line-height: 1.3; white-space: nowrap; }
.sig { left: 8mm; top: 82.9mm; width: 60mm; height: 5mm; font-weight: 600; font-size: 3.4mm; line-height: 1.3; white-space: nowrap; overflow: hidden; }
.adr, .ql { left: 80mm; width: 60mm; font-weight: 400; font-size: 3.3mm; line-height: 8mm; white-space: pre-wrap; overflow: hidden; }
.adr { top: 28.2mm; height: 16mm; }
.ql { top: 44.2mm; height: 8mm; white-space: nowrap; }
.qrimg { left: 97mm; top: 58mm; width: 26mm; height: 26mm; }
.url { left: 80mm; top: 85.2mm; width: 60mm; text-align: center; font-weight: 400; font-size: 2.2mm; line-height: 1.3; white-space: nowrap; }
.ft { left: 0; top: 92.4mm; width: 148mm; text-align: center; font-weight: 400; font-size: 3.5mm; line-height: 1.1; color: #2B3A55; }
.sw { left: 59mm; top: 96.2mm; width: 30mm; height: 3.2mm; }
.m { position: absolute; background: #000; }
.ueberlauf { outline: .6mm solid #d12f2f; outline-offset: .4mm; }
.leer { padding: 40px 16px; text-align: center; color: #4a5568; }
</style>
</head>
<body>
<div class="leiste" role="region" aria-label="Druck">
  <div class="knoepfe">
    <a class="umschalten" id="m-einzel" href="#">A6-Karten</a>
    <a class="umschalten" id="m-bogen" href="#">A4-Bogen mit Schnittmarken</a>
    <button type="button" class="druck" id="drucken">Drucken</button>
  </div>
  <span class="hinweis" id="hinweis">A6 quer, beidseitig, Größe 100 % (nicht „an Seite anpassen“).</span>
</div>
<div class="warnung" id="warnung" role="status"></div>
<main class="seiten" id="seiten"><p class="leer">Lade …</p></main>
<script>
(function () {
  var API = 'https://ticketing.basketball-loewen.com/webhook/';
  var q = new URLSearchParams(location.search);
  var CODES = (q.get('c') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 40);
  var MODUS = q.get('modus') === 'bogen' ? 'bogen' : 'einzel';   // Standard: A6-Karten
  var VON = { marko: 'Marko Fliege', andre: 'André Grenzdörffer' }[q.get('von') || ''] || '';
  var seiten = document.getElementById('seiten'), warnung = document.getElementById('warnung'), FEHLT = '';
  if (MODUS === 'einzel') { var st = document.createElement('style'); st.textContent = '@page { size: 148mm 105mm; margin: 0; } .pg { width: 148mm; height: 105mm; }'; document.head.appendChild(st); }
  ['bogen', 'einzel'].forEach(function (m) {
    var a = document.getElementById('m-' + m), u = new URLSearchParams(location.search); u.set('modus', m);
    a.href = '?' + u.toString(); if (m === MODUS) a.setAttribute('aria-current', 'true');
  });
  document.getElementById('drucken').addEventListener('click', function () { window.print(); });
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function vorne(c, o, beschnitt) {
    var h = esc(c.headline).replace(/\*(.+?)\*/g, '<b>$1</b>');
    return '<div class="cd" style="width:' + (148 + 2 * o) + 'mm;height:' + (105 + 2 * o) + 'mm">' +
      '<img src="' + esc(c.motiv) + '" alt="" style="position:absolute;left:' + (beschnitt ? 0 : -3) + 'mm;top:' + (beschnitt ? 0 : -3) + 'mm;width:154mm;height:111mm">' +
      '<div class="t" style="left:' + o + 'mm;top:' + o + 'mm"><div class="h">' + h + '</div><div class="n' + (c.bar_name_uppercase === false ? ' nc' : '') + '">' + esc(c.bar_name) + '</div><div class="c">' + esc(c.claim) + '</div></div></div>';
  }
  function hinten(b, o, nr) {
    return '<div class="cd" style="width:' + (148 + 2 * o) + 'mm;height:' + (105 + 2 * o) + 'mm">' +
      '<img src="/assets/postkarte/rueckseite.svg" width="154" height="111" alt="" style="position:absolute;left:' + (o ? 0 : -3) + 'mm;top:' + (o ? 0 : -3) + 'mm;width:154mm;height:111mm">' +
      '<div class="t" style="left:' + o + 'mm;top:' + o + 'mm">' +
      '<div class="f anrede">' + esc(b.anrede) + '</div><div class="f msg" data-pruefen="' + nr + '">' + esc(b.msg) + '</div>' +
      '<div class="f intro"></div><div class="f code"></div>' +
      '<div class="f abschied">' + esc(b.abschied) + '</div><div class="f sig">' + esc(b.sig) + '</div>' +
      '<div class="f adr" data-pruefen="' + nr + '">' + esc([b.adr1, b.adr2].filter(Boolean).join('\n')) + '</div><div class="f ql">' + esc(b.url) + '</div>' +
      '<img class="f qrimg" data-qr="' + esc('https://' + b.url) + '" alt="QR-Code zu ' + esc(b.url) + '"><div class="f url">' + esc(b.url) + '</div>' +
      '<div class="f ft">Gemeinsam stark.</div><img class="f sw" src="/assets/postkarte/swoosh.webp" width="384" height="41" alt=""></div></div>';
  }
  function marken(x0, y0) {
    var s = '', tx = x0 + 3, ty = y0 + 3;
    [[tx, ty], [tx + 148, ty], [tx, ty + 105], [tx + 148, ty + 105]].forEach(function (p) {
      var px = p[0], py = p[1], hx = px === tx ? px - 9 : px + 4, vy = py === ty ? py - 9 : py + 4;
      s += '<div class="m" style="left:' + hx + 'mm;top:' + (py - .12) + 'mm;width:5mm;height:.25mm"></div><div class="m" style="left:' + (px - .12) + 'mm;top:' + vy + 'mm;width:.25mm;height:5mm"></div>';
    });
    return s;
  }
  function setzen(jobs) {
    var h = '';
    if (MODUS === 'einzel') {
      jobs.forEach(function (j, i) {
        h += '<div class="pg" aria-label="Karte ' + (i + 1) + ' vorne"><div style="position:absolute;left:0;top:0">' + vorne(j.vorne, 0, false) + '</div></div>';
        h += '<div class="pg" aria-label="Karte ' + (i + 1) + ' hinten"><div style="position:absolute;left:0;top:0">' + hinten(j.hinten, 0, i) + '</div></div>';
      });
    } else {
      var pos = [[28, 26], [28, 26 + 111 + 34]];
      for (var i = 0; i < jobs.length; i += 2) {
        var v = '', b = '';
        jobs.slice(i, i + 2).forEach(function (j, k) {
          v += '<div style="position:absolute;left:' + pos[k][0] + 'mm;top:' + pos[k][1] + 'mm">' + vorne(j.vorne, 3, true) + '</div>' + marken(pos[k][0], pos[k][1]);
          b += '<div style="position:absolute;left:' + pos[k][0] + 'mm;top:' + pos[k][1] + 'mm">' + hinten(j.hinten, 3, i + k) + '</div>' + marken(pos[k][0], pos[k][1]);
        });
        h += '<div class="pg" aria-label="Bogen ' + (i / 2 + 1) + ' Vorderseiten">' + v + '</div><div class="pg" aria-label="Bogen ' + (i / 2 + 1) + ' Rückseiten">' + b + '</div>';
      }
    }
    seiten.innerHTML = h;
    [].slice.call(document.querySelectorAll('[data-qr]')).forEach(function (im) { qrLoewe(im.getAttribute('data-qr'), 1040).then(function (src) { im.src = src; }); });
    // Zu lange Texte nie verkleinern: rot markieren und melden
    var lang = [];
    function pruefen() {
      lang = [];
      [].slice.call(document.querySelectorAll('[data-pruefen]')).forEach(function (el) {
        var zu = el.scrollHeight > el.clientHeight + 1;
        el.classList.toggle('ueberlauf', zu);
        if (zu) { var n = jobs[Number(el.getAttribute('data-pruefen'))]; if (n && lang.indexOf(n.hinten.adr1) < 0) lang.push(n.hinten.adr1 || n.hinten.code); }
      });
      warnung.textContent = [lang.length ? 'Zu langer Text auf ' + lang.length + (lang.length === 1 ? ' Karte' : ' Karten') + ' (rot markiert): ' + lang.join(', ') + '. Bitte in 305 kürzen.' : '', FEHLT].filter(Boolean).join(' ');
    }
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(pruefen);
  }
  if (!CODES.length) { seiten.innerHTML = '<p class="leer">Keine Karten gewählt. Die Postkarten werden in 305 unter Vertrieb › Kampagnen gedruckt.</p>'; return; }
  Promise.all([
    fetch('/data/postkarten.json?v=1').then(function (r) { return r.json(); }),
    fetch(API + 'postkarte?c=' + encodeURIComponent(CODES.join(',')), { cache: 'no-store' }).then(function (r) { return r.json(); })
  ]).then(function (res) {
    var karten = {}; (res[0].karten || []).forEach(function (k) { karten[k.id] = k; });
    var fehlen = [], jobs = [];
    (res[1].karten || []).forEach(function (d) {
      if (!d.ok) { fehlen.push(d.code); return; }
      var std = karten[d.karte_id] || karten['partner-herz'];
      jobs.push({ vorne: { motiv: std.motiv, headline: d.headline || std.headline, bar_name: d.balken || std.bar_name, bar_name_uppercase: std.bar_name_uppercase, claim: d.claim || std.claim },
        hinten: { anrede: d.anrede, msg: d.msg, abschied: d.abschied, sig: VON || d.sig, adr1: d.adr1, adr2: d.adr2, url: d.url, code: d.code } });
    });
    if (!jobs.length) { seiten.innerHTML = '<p class="leer">Zu diesen Codes gibt es keine Karte (mehr).</p>'; return; }
    if (fehlen.length) FEHLT = 'Ohne Karte (Seite abgeschaltet oder unbekannt): ' + fehlen.join(', ') + '.';
    setzen(jobs);
    document.getElementById('hinweis').textContent = jobs.length + (jobs.length === 1 ? ' Karte' : ' Karten') + ' · ' + (MODUS === 'bogen' ? Math.ceil(jobs.length / 2) + ' A4-Bögen' : jobs.length * 2 + ' Seiten A6 quer (Karton A6 einlegen)') + ' · beidseitig, ' + (MODUS === 'bogen' ? 'Wenden an der langen Kante' : 'Wenden an der kurzen Kante (Querformat)') + ', Größe 100 %, ' + (MODUS === 'bogen' ? 'Papier 160 g.' : 'Postkartenkarton.');
  }).catch(function () { seiten.innerHTML = '<p class="leer">Die Karten konnten nicht geladen werden. Bitte später noch einmal versuchen.</p>'; });
})();
</script>
</body>
</html>
