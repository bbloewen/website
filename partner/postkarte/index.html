<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noai, noimageai" />
<meta name="referrer" content="no-referrer" />
<title>Postkarte — Basketball Löwen</title>
<link rel="icon" href="/assets/logo/loewen-logo-4c.svg" />
<link rel="stylesheet" href="/css/colors_and_type.css?v=1785398309" />
<!-- Postkarte zur persönlichen Partnerseite (Migration 546, Marko 26.11.2026). Interne Druckseite, nicht verlinkt.
     ?c=<code> holt Firma, Ansprache, Begrüßung, Bandenzeile und Postkartensatz aus 305 (partner-seite, zählt nichts).
     Vorderseite: Halle mit der LED-Bande der Firma und dem Satz der Branchenkarte. Rückseite: handschriftlicher Gruß, QR-Code zur Seite (Herkunft Postkarte).
     ?von=marko|andre wählt, wer unterschreibt (wer die Karte persönlich abgibt). Druck: A6 quer (148 × 105 mm), randlos, beidseitig an der kurzen Kante. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/js/qr-loewe.js?v=1795780000"></script>
<style>
:root { --navy: #00122D; --orange: #E5710B; --orange-text: #B55709; }
* { box-sizing: border-box; }
body { margin: 0; background: #e9ecf1; color: var(--navy); font-family: 'Lexend', sans-serif; }
.leiste { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; background: #fff; border-bottom: 1px solid #dfe3ea; font-size: 14px; }
.leiste button { min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--orange); color: var(--navy); font: 700 15px 'Lexend', sans-serif; cursor: pointer; }
.leiste button:focus-visible { outline: 3px solid #0028AA; outline-offset: 2px; }
.leiste span { color: #5b6475; }
.seiten { display: grid; gap: 28px; justify-content: center; padding: 28px 16px 60px; }
.karte { width: 148mm; height: 105mm; position: relative; overflow: hidden; background: #fff; box-shadow: 0 10px 30px rgba(0,18,45,.18); }
.seite-titel { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #5b6475; margin: 0 0 6px; }
/* Vorderseite */
.vorne img.halle { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 70%; }
.vorne .schatten { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,18,45,.86) 0%, rgba(0,18,45,.55) 34%, rgba(0,18,45,0) 58%); }
.vorne .logo { position: absolute; left: 6mm; top: 5.5mm; width: 15mm; height: 15mm; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }
.vorne .logo img { width: 12mm; height: auto; display: block; }
.vorne h1 { position: absolute; left: 25mm; right: 7mm; top: 6mm; margin: 0; color: #fff; font-weight: 900; font-size: 15.5pt; line-height: 1.12; letter-spacing: -.01em; }
.vorne h1 span { color: var(--orange); }
.bande { position: absolute; left: 0; right: 0; height: 9mm; background: #05070c; overflow: hidden; display: flex; align-items: center; box-shadow: 0 0 0 .3mm #1b1f2a, 0 1.5mm 4mm rgba(0,0,0,.45); }
.bande::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.5) 35%, transparent 36%); background-size: .7mm .7mm; }
.bande-lauf { display: flex; white-space: nowrap; transform: translateX(-6mm); }
.bande-lauf span { padding: 0 5mm; font: 900 13pt/1 'Lexend', sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #fff; text-shadow: 0 0 2mm rgba(255,255,255,.55); }
.bande-lauf span.z { color: #F09E4C; font-size: 8pt; font-weight: 700; align-self: center; text-shadow: 0 0 2mm rgba(240,158,76,.6); }
.bande-lauf span.l { display: inline-flex; align-items: center; padding: 0 4mm; }
.bande-lauf span.l img { height: 7mm; width: auto; }
.vorne .unten { position: absolute; left: 6mm; bottom: 4mm; color: #fff; font-size: 7pt; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
/* Rückseite */
.hinten { display: grid; grid-template-columns: 1fr .3mm 52mm; gap: 0 6mm; padding: 7mm 7mm 6mm 8mm; }
.hinten .trenner { background: #cfd5df; }
.hand { font-family: 'Caveat', cursive; font-weight: 500; font-size: 15.5pt; line-height: 1.12; color: #1d2c6b; }
.hand p { margin: 0 0 1.6mm; }
.hand .unterschrift { font-weight: 700; font-size: 21pt; margin: 1mm 0 0; color: #1d2c6b; }
.gedruckt { font-family: 'Lexend', sans-serif; font-size: 6pt; color: #5b6475; margin-top: .5mm; }
.rechts { display: flex; flex-direction: column; }
.rechts .fuer { font-size: 6.5pt; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--orange-text); margin: 0 0 1.2mm; }
.rechts .name { font-weight: 800; font-size: 10pt; line-height: 1.2; }
.rechts .firma { font-weight: 300; font-size: 9pt; line-height: 1.25; margin: 0 0 3mm; }
.qr { width: 27mm; height: 27mm; }
.qr svg { width: 100%; height: 100%; display: block; }
.qr-text { font-size: 7pt; font-weight: 700; margin: 1.6mm 0 .6mm; }
.qr-url { font-size: 5.5pt; color: #5b6475; word-break: break-all; }
.marke { margin-top: auto; display: flex; align-items: center; gap: 2mm; font-size: 6pt; font-weight: 600; white-space: nowrap; }
.marke img { width: 8mm; height: auto; }
.marke b { color: var(--orange-text); }
.fehler { max-width: 520px; margin: 60px auto; text-align: center; font-size: 16px; }
@page { size: 148mm 105mm; margin: 0; }
@media print {
  body { background: #fff; }
  .leiste, .seite-titel { display: none !important; }
  .seiten { display: block; padding: 0; }
  .karte { box-shadow: none; page-break-after: always; break-after: page; }
  .vorne * , .hinten * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .vorne, .bande, .schatten { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="leiste"><span id="info">Postkarte A6 quer · Druck randlos, beidseitig an der kurzen Kante wenden</span><button type="button" id="drucken">Drucken oder als PDF speichern</button></div>
<main class="seiten" id="seiten" hidden></main>
<template id="vorlage">
  <div>
    <p class="seite-titel">Vorderseite</p>
    <section class="karte vorne" aria-label="Vorderseite der Postkarte">
      <img class="halle" src="/assets/img/hero-tickets-halle.webp" width="2000" height="1333" alt="Heimspiel der Basketball Löwen in der Riethsporthalle" />
      <div class="schatten"></div>
      <div class="bande" data-f="bande" aria-hidden="true"><div class="bande-lauf" data-f="bande-lauf"></div></div>
      <div class="logo"><img src="/assets/logo/loewen-logo-4c.svg" width="600" height="565" alt="Basketball Löwen" /></div>
      <h1 data-f="satz"></h1>
    </section>
  </div>
  <div>
    <p class="seite-titel">Rückseite</p>
    <section class="karte hinten" aria-label="Rückseite der Postkarte">
      <div class="hand" data-f="hand"></div>
      <div class="trenner" aria-hidden="true"></div>
      <div class="rechts">
        <p class="fuer">Persönlich für</p>
        <div class="name" data-f="name"></div>
        <div class="firma" data-f="firma"></div>
        <div class="qr" data-f="qr" role="img" aria-label="QR-Code zur persönlichen Seite"></div>
        <div class="qr-text" data-f="qr-text"></div>
        <div class="qr-url" data-f="qr-url"></div>
        <div class="marke"><img src="/assets/logo/loewen-logo-4c.svg" width="600" height="565" alt="" /><span>Basketball Löwen · <b>Gemeinsam stark.</b></span></div>
      </div>
    </section>
  </div>
</template>
<div class="fehler" id="fehler" hidden>Diese Postkarte gibt es nicht. Bitte den Link aus 305 nehmen (Kasten „Persönliche Seite“ › „Postkarte drucken“).</div>
<script>
(function () {
  var API = 'https://ticketing.basketball-loewen.com/webhook/';
  var sp = new URLSearchParams(location.search);
  // eine oder mehrere Karten: ?c=code oder ?c=code1,code2,… (Sammeldruck einer Kampagne aus 305, Migration 553)
  var CODES = (sp.get('c') || '').toLowerCase().split(',').map(function (x) { return x.replace(/[^a-z0-9]/g, '').slice(0, 16); }).filter(Boolean).slice(0, 200);
  var LOKAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var VON = sp.get('von') === 'andre' ? { name: 'André Grenzdörffer', kurz: 'André', rolle: 'Head of Partnerships' } : { name: 'Marko Fliege', kurz: 'Marko', rolle: 'Kaufmännischer Leiter' };
  var $ = function (id) { return document.getElementById(id); };
  function neu(tag, cls, s) { var e = document.createElement(tag); if (cls) e.className = cls; if (s != null) e.textContent = s; return e; }
  function satzSetzen(el, s) { el.textContent = ''; String(s).split(/(\*[^*]+\*)/).forEach(function (t) { if (/^\*[^*]+\*$/.test(t)) el.appendChild(neu('span', null, t.slice(1, -1))); else if (t) el.appendChild(document.createTextNode(t)); }); }
  function bandeSetzen(box) {
    var img = box.querySelector('img.halle'), b = box.querySelector('[data-f="bande"]');
    var W = box.clientWidth, H = box.clientHeight, iw = img.naturalWidth || 2000, ih = img.naturalHeight || 1333;
    var k = Math.max(W / iw, H / ih), rh = ih * k, oy = (rh - H) * 0.70;
    b.style.top = Math.round(0.756 * rh - oy) + 'px'; b.style.height = Math.round(Math.max(18, 0.064 * rh)) + 'px';
  }
  function zeigen(d, code) {
    var frag = $('vorlage').content.cloneNode(true), f = function (n) { return frag.querySelector('[data-f="' + n + '"]'); };
    var du = d.ansprache === 'du', T = function (a, b) { return du ? a : b; };
    var firma = d.firma || 'Ihr Unternehmen', b = d.branche || {};
    var apotheke = /apothek/i.test((b.name || '') + ' ' + firma);
    satzSetzen(f('satz'), b.postkarte || ('*' + firma + '* wird löwenstark.'));
    var lauf = f('bande-lauf'), logo = function () { var w = neu('span', 'l'); var im = document.createElement('img'); im.src = '/assets/logo/loewen-logo-4c.svg'; im.alt = ''; w.appendChild(im); return w; };
    for (var i = 0; i < 3; i++) { lauf.appendChild(neu('span', null, firma)); if (d.bande_zeile) lauf.appendChild(neu('span', 'z', d.bande_zeile)); lauf.appendChild(logo()); }
    // Rückseite: handschriftlicher Gruß
    var h = f('hand');
    h.appendChild(neu('p', null, d.anrede_name ? (du ? 'Hallo ' + d.anrede_name + ',' : 'Guten Tag, ' + d.anrede_name + ',') : T('Hallo,', 'Guten Tag,')));
    h.appendChild(neu('p', null, T('ich war heute bei dir' + (apotheke ? ' in der Apotheke' : '') + ' und habe deinem Team diese Karte für dich dagelassen.',
      'ich war heute bei Ihnen' + (apotheke ? ' in der Apotheke' : '') + ' und habe Ihrem Team diese Karte für Sie dagelassen.')));
    h.appendChild(neu('p', null, T('Wir haben uns überlegt, wie ' + firma + ' bei den Basketball Löwen aussehen könnte. Scann einfach den Code, dort wartet ein kurzes Video auf dich.',
      'Wir haben uns überlegt, wie ' + (apotheke && !/^die /i.test(firma) ? 'die ' : '') + firma + ' bei den Basketball Löwen aussehen könnte. Scannen Sie einfach den Code, dort wartet ein kurzes Video auf Sie.')));
    h.appendChild(neu('p', null, 'Herzliche Grüße'));
    h.appendChild(neu('p', 'unterschrift', VON.kurz === 'Marko' && du ? 'Marko' : VON.name));
    h.appendChild(neu('div', 'gedruckt', VON.name + ' · ' + VON.rolle + ', Basketball Löwen'));
    f('name').textContent = d.anrede_name || '';
    f('firma').textContent = firma;
    // Kurzlink /g/<CODE> (Migration 554), sonst der lange Link
    var url = d.kurz ? 'https://basketball-loewen.com/g/' + d.kurz : 'https://basketball-loewen.com/partner/fuer/?c=' + code + '&q=flyer';
    f('qr-text').textContent = T('Dein Video: einfach scannen', 'Ihr Video: einfach scannen');
    f('qr-url').textContent = url.replace('https://', '');
    var qrBox = f('qr'); qrLoewe(url, 1040).then(function (src) { var im = document.createElement('img'); im.src = src; im.alt = ''; im.style.width = '100%'; im.style.height = '100%'; qrBox.appendChild(im); });
    var vorne = frag.querySelector('.vorne'); frag.querySelectorAll('.seite-titel').forEach(function (t) { t.textContent += ' · ' + firma; });
    $('seiten').appendChild(frag); $('seiten').hidden = false;
    var im = vorne.querySelector('img.halle'); if (im.complete) bandeSetzen(vorne); else im.addEventListener('load', function () { bandeSetzen(vorne); }); bandeSetzen(vorne);
  }
  $('drucken').addEventListener('click', function () { window.print(); });
  var MUSTER = { ok: true, firma: 'Sonnen-Apotheke', ansprache: 'sie', anrede_name: 'Frau Muster', bande_zeile: 'Ihre Apotheke in Erfurt.', branche: { name: 'Apotheken', postkarte: 'Wir bringen Erfurt in Bewegung. Sie halten Erfurt *gesund*.' } };
  function fehler() { $('fehler').hidden = false; }
  if (!CODES.length) return fehler();
  if (LOKAL && CODES[0] === 'muster') { zeigen(MUSTER, 'muster'); if (CODES[1] === 'muster') zeigen(Object.assign({}, MUSTER, { firma: 'Anger-Apotheke', anrede_name: 'Herr Beispiel' }), 'muster'); return; }
  // nacheinander laden, damit die Reihenfolge (Route) erhalten bleibt
  var fehlt = 0, n = 0;
  (function weiter(i) {
    if (i >= CODES.length) { $('info').textContent = n + (n === 1 ? ' Postkarte' : ' Postkarten') + ' · A6 quer, randlos, beidseitig an der kurzen Kante wenden' + (fehlt ? ' · ' + fehlt + ' nicht gefunden' : ''); if (!n) fehler(); else document.title = n === 1 ? 'Postkarte — Basketball Löwen' : n + ' Postkarten — Basketball Löwen'; return; }
    fetch(API + 'partner-seite?c=' + encodeURIComponent(CODES[i]), { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok) { zeigen(d, CODES[i]); n++; } else fehlt++; }).catch(function () { fehlt++; }).then(function () { weiter(i + 1); });
  })(0);
})();
</script>
</body>
</html>
